<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yebunna OS</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <a class="logo" href="#/" title="Yebunna OS">
            <img src="/logo.svg" alt="" width="28" height="28" />
            <span>Yebunna</span>
          </a>
          <button class="icon-btn only-mobile" id="close-sidebar" aria-label="Close menu">✕</button>
        </div>

        <a class="new-btn" href="#/">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          New mission
        </a>

        <nav class="nav">
          <a href="#/" data-nav="home"><span class="ni">⌂</span>Command center</a>
          <a href="#/meetings" data-nav="meetings"><span class="ni">👥</span>Meetings<span class="badge" hidden></span></a>
          <a href="#/board" data-nav="board"><span class="ni">▦</span>Task board<span class="badge" hidden></span></a>
          <a href="#/skills" data-nav="skills"><span class="ni">🧩</span>Skills</a>
          <a href="#/routines" data-nav="routines"><span class="ni">⏰</span>Routines</a>
          <a href="#/files" data-nav="files"><span class="ni">📁</span>Files</a>
          <a href="#/connections" data-nav="connections"><span class="ni">🔌</span>Connections</a>
          <a href="#/team" data-nav="team"><span class="ni">✦</span>Team</a>
          <a href="#/settings" data-nav="settings"><span class="ni">⚙</span>Settings</a>
        </nav>

        <div class="history">
          <div class="history-title">Bots</div>
          <div id="bot-list" class="bot-list"></div>
          <div class="history-title">Missions</div>
          <div id="mission-list"></div>
        </div>

        <div class="sidebar-footer" id="engine"></div>
      </aside>

      <main class="main">
        <button class="icon-btn menu-btn only-mobile" id="open-sidebar" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div id="limit-banner" class="limit-banner" hidden></div>
        <div id="view"></div>
      </main>
    </div>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
