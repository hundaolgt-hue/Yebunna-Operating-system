<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yebunna OS</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <a class="logo" href="#/" title="Yebunna OS">
            <img src="/logo.svg" alt="" width="28" height="28" />
            <span>Yebunna</span>
          </a>
          <button class="icon-btn only-mobile" id="close-sidebar" aria-label="Close menu">✕</button>
        </div>

        <a class="new-btn" href="#/">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          New mission
        </a>

        <nav class="nav">
          <a href="#/" data-nav="home">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 12l8-8 8 8M6 10v10h12V10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            Command center
          </a>
          <a href="#/board" data-nav="board">
            <svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="4" width="5" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="10" y="4" width="5" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="17" y="4" width="4" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            Task board
          </a>
          <a href="#/team" data-nav="team">
            <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.8a3.5 3.5 0 010 6.4M18 14.8c1.9.8 3.1 2.6 3.5 5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            Team
          </a>
        </nav>

        <div class="history">
          <div class="history-title">Missions</div>
          <div id="mission-list"></div>
        </div>

        <div class="sidebar-footer" id="engine"></div>
      </aside>

      <main class="main">
        <button class="icon-btn menu-btn only-mobile" id="open-sidebar" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div id="view"></div>
      </main>
    </div>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
